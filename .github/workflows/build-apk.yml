name: Build Neelpadmo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > NeelpadmoAndroid/local.properties
          gradle -p NeelpadmoAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neelpadmo-debug-APK
          path: NeelpadmoAndroid/app/build/outputs/apk/debug/app-debug.apk
